[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008",    # function-call-in-default-argument (FastAPI Depends pattern)
    "E501",    # line-too-long (handled by formatter)
    "SIM108",  # if-else-block-instead-of-if-exp (readability preference)
    "UP007",   # non-pep604-annotation (Optional[] is fine)
    "RUF013",  # implicit-optional (too many existing instances, tighten later)
    "E741",    # ambiguous-variable-name (mock service code uses short vars)
    "B905",    # zip-without-explicit-strict (noisy, not a bug)
    "SIM102",  # collapsible-if (readability preference, nested ifs can be clearer)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
