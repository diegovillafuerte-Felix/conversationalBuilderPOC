[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "conversational: marks tests as LLM-based conversational tests",
    "e2e: end-to-end conversation tests against live servers",
]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008",    # function-call-in-default-argument (FastAPI Depends pattern)
    "E501",    # line-too-long (handled by formatter)
    "SIM108",  # if-else-block-instead-of-if-exp (readability preference)
    "UP007",   # non-pep604-annotation (Optional[] is fine)
    "RUF013",  # implicit-optional (too many existing instances, tighten later)
    "B905",    # zip-without-explicit-strict (noisy, not a bug)
    "UP042",   # replace-str-enum (style preference, existing code)
    "RUF012",  # mutable-class-default (style preference for class constants)
    "SIM102",  # collapsible-if (readability preference, nested ifs can be clearer)
    "E402",    # module-import-not-at-top (needed for circular import workarounds)
    "RUF005",  # collection-literal-concatenation (explicit concat is clearer for mutations)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
implicit_optional = true
warn_return_any = false
warn_unused_configs = true
check_untyped_defs = false
# Permissive start — tighten these over time:
disable_error_code = [
    "no-any-return",     # too many untyped returns from JSON/dict code
    "return-value",      # loose return types in existing code
    "union-attr",        # optional chaining without None checks
    "arg-type",          # loose argument types
    "index",             # indexing Optional dicts
    "call-arg",          # missing/extra args in dynamic code
    "valid-type",        # callable vs Callable
    "misc",              # catch-all for async generator return types etc.
    "operator",          # unsupported operand types
    "assignment",        # type narrowing issues in existing code
    "var-annotated",     # missing type annotations for variables
]

[[tool.mypy.overrides]]
module = "app.schemas.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "app.core.config_types"
disallow_untyped_defs = true
